{{- if .Values.rateLimit.traefik.enabled -}}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "clock-server.fullname" . }}-ratelimit
  labels:
    {{- include "clock-server.labels" . | nindent 4 }}
spec:
  rateLimit:
    average: {{ .Values.rateLimit.average }}
    period: {{ .Values.rateLimit.period | quote }}
    burst: {{ .Values.rateLimit.burst }}
{{- end }}
